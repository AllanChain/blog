name: Build and Deploy to gh-pages

on:
  push:
    branches:
      - astro
    tags-ignore:
      - "**"
  issues:
    types: [opened, edited]
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 5"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build the Pages
    runs-on: ubuntu-latest
    # The sender must be me. And if it's an issue, must contain such label.
    if: >
      github.event_name == 'schedule' ||
      github.event.sender.login == 'AllanChain' &&
      (!github.event.issue || contains(github.event.issue.labels.*.name, '@post'))
    steps:
      - uses: actions/checkout@master
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable
      - name: Setup image cache
        uses: actions/cache@v4
        with:
          path: public/img/
          key: image
      - name: Build pages
        run: |
          # See https://github.com/nodejs/corepack/issues/612#issuecomment-2629911771
          export COREPACK_INTEGRITY_KEYS="$(curl https://registry.npmjs.org/-/npm/v1/keys | jq -c '{npm: .keys}')"
          pnpm install
          pnpm build
          mkdir -p dist/img
          cp public/img/* dist/img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy the Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
